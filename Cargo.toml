[workspace]
resolver = "2"
members = [
    "crates/rtfsn-core",
    "crates/rtfsn-net",
    "crates/rtfsn-daemon",
    "crates/rtfsn-wasm",
    "crates/rtfsn-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rtfsn-core = { path = "crates/rtfsn-core" }
rtfsn-net = { path = "crates/rtfsn-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rand = "0.9"
thiserror = "2"
tracing = "0.1"
